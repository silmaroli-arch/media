# Aumenta o timeout do proxy do nginx (padrão da plataforma é 60s) - a
# importação de PDF de preparo agora chama a IA (Gemini) de verdade pra ler
# o documento (ver app/ia_pdf_preparo.py), o que pode legitimamente demorar
# mais que isso em picos de tráfego do lado da Google, e o código já tenta
# de novo uma vez em caso de sobrecarga passageira (503) antes de desistir -
# sem esse aumento, o nginx desiste e devolve 504 pro usuário mesmo quando o
# processo Python ainda ia conseguir terminar a tempo (visto em produção em
# 2026-08-19: POST /equipe/preparo-modelos/importar-xlsx deu 504 antes da
# extração terminar). Efeito colateral aceitável: outras rotas lentas (se
# um dia existirem) também esperam mais antes do nginx desistir - não há
# rota nesse sistema hoje que se beneficie de um timeout mais curto.
proxy_read_timeout 120s;
proxy_connect_timeout 120s;
proxy_send_timeout 120s;
