# Configuração do ambiente de PRODUÇÃO (media-prod) do MedIA no Render
# (render.com).
#
# Este arquivo (branch "main") descreve SÓ os recursos de produção:
# media-prod (web service) e media-prod-db (Postgres), ambos em planos
# pagos (decisão do Silvan, 2026-09-28: Starter ~US$7/mês + Postgres
# Basic-1gb ~US$19/mês (Render descontinuou o nome legado "starter" para
# bancos novos em 2026-09; o valor em dólares é o mesmo), ≈US$26/mês, ver pesquisa de preço Render vs. AWS em
# HANDOFF_CHAT.md).
#
# **Por que este arquivo NÃO lista media-dev/media-dev-db** (2026-09-28):
# na primeira tentativa de criar o Blueprint de produção, o branch "main"
# ainda carregava, dentro deste mesmo arquivo, a definição antiga do
# media-dev (herdada do momento em que "main" foi promovido a partir do
# "dev", antes deste ajuste) - isso fez o Render, ao ler render.yaml pelo
# branch "main", tentar CRIAR UM SEGUNDO media-dev/media-dev-db do nada
# (a opção "Create all as new services" ficou "media-dev-s2kt", em vez de
# criar o media-prod) - falhou por sorte (limite de 1 banco free por
# conta), mas por pouco. A partir de agora, cada branch descreve só o
# próprio ambiente: "dev" continua com seu próprio render.yaml
# (media-dev/media-dev-db, plano free) e "main" só com este
# (media-prod/media-prod-db, pagos) - NUNCA misturar os dois blocos no
# mesmo arquivo de novo, mesmo que uma promoção futura (merge dev→main)
# traga esse arquivo junto por engano; sempre confira, antes de dar
# `git push origin main`, que este arquivo continua só com media-prod.
#
# **Separação de branch (decisão do Silvan, 2026-09-28)**: media-dev
# continua observando o branch "dev" (onde cai tudo, inclusive o
# auto-commit da sua máquina, o tempo todo) - com seu PRÓPRIO
# render.yaml, mantido separadamente neste mesmo repositório. media-prod
# observa um branch SEPARADO, "main" - produção só recebe uma mudança
# nova quando alguém (você) decide promover, fazendo merge de código
# (nunca deste arquivo de infraestrutura) de "dev" para "main" e enviando
# (push) - nunca automaticamente a partir de "dev". Isso evita que uma
# mudança ainda incompleta em "dev" vá direto pro ar pros clientes reais.
#
# Como promover uma mudança de código (app/, templates/, etc.) de dev
# para produção, quando estiver pronta:
#   git checkout main
#   git merge dev -- app/ templates/ (ou os caminhos específicos, NUNCA
#     render.yaml - ver aviso acima)
#   git push origin main
#   (o Render detecta o push em "main" e faz o deploy automático do
#   media-prod, do mesmo jeito que já faz hoje com "dev" e o media-dev)
#
# Como usar (primeira vez, criação do Blueprint de produção):
# 1. No painel do Render, escolha "New" > "Blueprint", aponte para este
#    repositório, branch "main" - o Render lê este arquivo e propõe criar
#    os 2 recursos abaixo. Como nenhum deles existe ainda com esses
#    nomes, a tela NÃO deve perguntar "associate existing / create new" -
#    se perguntar, e mencionar media-dev, PARE e não confirme (avise antes
#    de continuar).
# 2. Preencha manualmente, no painel, as variáveis marcadas com
#    "sync: false" abaixo (nunca ficam neste arquivo, que é público no
#    Git) - são valores PRÓPRIOS de produção, não uma cópia dos de dev
#    (ver observações no final deste comentário).
# 3. A partir daí, todo push no branch "main" faz deploy automático do
#    media-prod.

services:
  - type: web
    name: media-prod
    runtime: python
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    # Mesmo startCommand usado no media-dev (branch "dev", ver render.yaml
    # daquele branch) - a migração de schema (migrar_banco.py) é
    # idempotente e roda a cada start, inclusive em produção.
    #
    # IMPORTANTE (decisão a confirmar com o Silvan antes de ir ao ar):
    # migrar_banco.py recria automaticamente a conta padrão do dono
    # (dono@plataforma.com / 123456) se não existir NENHUM usuário tipo
    # "dono" no banco - isso é ótimo pra media-dev (ambiente de teste),
    # mas em produção, no primeiro deploy (banco novo, vazio), essa conta
    # padrão vai nascer com essa senha conhecida publicamente (está neste
    # mesmo repositório). Trocar essa senha (ou o e-mail) IMEDIATAMENTE
    # depois do primeiro login em produção é essencial - não é algo que o
    # startCommand faz sozinho, tem que ser feito manualmente uma vez.
    startCommand: "python gerar_deploy_info_render.py; python migrar_banco.py && gunicorn application:application --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: media-prod-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # As mesmas variáveis opcionais do media-dev (ver render.yaml do
      # branch "dev") - mas com valores PRÓPRIOS de produção, não uma
      # cópia dos de dev. Ver observações no final deste arquivo sobre
      # quais valem a pena reaproveitar e quais devem ser diferentes
      # (WhatsApp/Mercado Pago sobretudo).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_META_APP_SECRET
        sync: false
      - key: WHATSAPP_META_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_META_PHONE_NUMBER_ID
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
      - key: APP_URL_PUBLICA
        sync: false

databases:
  - name: media-prod-db
    plan: basic-1gb
    databaseName: media_prod
    user: media_prod

# Variáveis a preencher manualmente no painel do Render (Dashboard >
# media-prod > Environment) - NÃO é uma cópia direta do media-dev:
#   - ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY: pode reaproveitar
#     as MESMAS chaves do media-dev (são chaves de API por conta, não por
#     ambiente) - ou criar chaves separadas se quiser isolar o custo/uso de
#     IA entre dev e produção nos painéis da Anthropic/Google/OpenAI.
#   - WHATSAPP_META_* (verify token, app secret, access token, phone
#     number id): DECISÃO A TOMAR com o Silvan antes de configurar -
#     produção deve usar um número de telefone/App do WhatsApp Business
#     PRÓPRIO, diferente do número de teste do media-dev (pra não misturar
#     conversas de teste com pacientes reais, e porque o número de
#     telefone é vinculado a um único ambiente por vez na Meta).
#   - MERCADOPAGO_ACCESS_TOKEN / MERCADOPAGO_WEBHOOK_SECRET: token de
#     PRODUÇÃO de verdade da conta Mercado Pago (não o de teste/sandbox
#     usado - sem sucesso até agora - no media-dev, ver "Setup do Mercado
#     Pago" em HANDOFF_CHAT.md). Webhook precisa ser recadastrado com a
#     URL de produção (https://media.med.br/webhooks/mercadopago ou o
#     domínio final escolhido).
#   - VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_CLAIM_EMAIL: gere um
#     par NOVO só para produção com `python gerar_chaves_vapid.py` (não
#     reaproveite o par do media-dev - são chaves por ambiente, e gerar de
#     novo invalida qualquer inscrição já feita, o que não é problema
#     aqui já que produção começa do zero).
#   - APP_URL_PUBLICA: o domínio final de produção (ex.:
#     https://media.med.br) - usado nos links que o sistema manda por
#     WhatsApp (preparo público, resultado de exame, etc.).
#
# Depois do primeiro deploy de produção, ainda faltam (fora deste
# arquivo, direto no painel/DNS):
#   - Cadastrar o domínio customizado em media-prod > Settings > Custom
#     Domains, e criar o registro DNS correspondente (CNAME/A, o próprio
#     Render mostra qual) no provedor de DNS de media.med.br.
#   - Trocar a senha (ou e-mail) da conta padrão do dono
#     (dono@plataforma.com / 123456) logo depois do primeiro login - ver
#     comentário no serviço media-prod acima.