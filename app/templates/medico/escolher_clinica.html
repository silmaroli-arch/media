{% extends "base.html" %}
{% block titulo %}Escolher clínica{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 mt-4">
      <h4 class="mb-3 text-center">Em qual clínica você quer trabalhar agora?</h4>
      <p class="text-muted small text-center">Sua conta está vinculada a mais de uma clínica.</p>
      <form method="post">
        <div class="list-group">
          {% for c in clinicas %}
          <label class="list-group-item d-flex align-items-center gap-2">
            <input type="radio" name="clinica_id" value="{{ c.id }}" class="form-check-input mt-0" required>
            <span>{{ c.nome }}</span>
          </label>
          {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
