{% extends "base.html" %}
{% block titulo %}Anúncios{% endblock %}
{% block conteudo %}
<a href="{{ url_for('dono.dashboard') }}" class="small d-inline-block mb-2">&larr; Voltar ao painel</a>
<h3 class="mb-1">Anúncios</h3>
<p class="text-muted">Mande um aviso pra um médico/secretária específico ou pra todo mundo - aparece no sininho de notificações da pessoa.</p>

<div class="card mb-4">
  <div class="card-body">
    <form method="post" action="{{ url_for('dono.anuncio_enviar') }}">
      <div class="mb-3">
        <label class="form-label">Para quem?</label>
        <select name="destinatario" class="form-select" style="max-width: 350px;">
          <option value="todos">Todo mundo (médicos e secretárias)</option>
          {% for usuario in equipe %}
          <option value="{{ usuario.id }}">{{ usuario.nome }} ({{ "Médico" if usuario.tipo == "medico" else "Secretaria" }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" style="max-width: 500px;" placeholder="Ex.: Manutenção programada" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mensagem</label>
        <textarea name="mensagem" class="form-control" rows="4" placeholder="Escreva o aviso..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-megaphone me-1"></i>Enviar anúncio</button>
    </form>
  </div>
</div>
{% endblock %}
