{% extends "base.html" %}
{% block titulo %}Login do paciente{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-5">
      <h4 class="mb-3 text-center"><i class="bi bi-heart-pulse"></i> Media</h4>
      <p class="text-muted small text-center">Acesso do paciente: informe o telefone cadastrado na clínica e sua data de nascimento. Não é necessário senha.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Telefone</label>
          <input type="text" inputmode="numeric" name="telefone" id="telefone"
                 class="form-control" placeholder="(27) 99999-9999" maxlength="15" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Data de nascimento</label>
          <input type="text" inputmode="numeric" name="data_nascimento" id="data_nascimento"
                 class="form-control" placeholder="DD/MM/AAAA" maxlength="10" autocomplete="bday" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
      <script>
        (function () {
          var campoData = document.getElementById("data_nascimento");
          campoData.addEventListener("input", function () {
            var digitos = campoData.value.replace(/\D/g, "").slice(0, 8);
            if (digitos.length > 4) {
              campoData.value = digitos.slice(0, 2) + "/" + digitos.slice(2, 4) + "/" + digitos.slice(4);
            } else if (digitos.length > 2) {
              campoData.value = digitos.slice(0, 2) + "/" + digitos.slice(2);
            } else {
              campoData.value = digitos;
            }
          });

          var campoTelefone = document.getElementById("telefone");
          campoTelefone.addEventListener("input", function () {
            var digitos = campoTelefone.value.replace(/\D/g, "").slice(0, 11);
            var formatado = digitos;
            if (digitos.length > 6) {
              formatado = "(" + digitos.slice(0, 2) + ") " + digitos.slice(2, digitos.length > 10 ? 7 : 6) + "-" + digitos.slice(digitos.length > 10 ? 7 : 6);
            } else if (digitos.length > 2) {
              formatado = "(" + digitos.slice(0, 2) + ") " + digitos.slice(2);
            } else if (digitos.length > 0) {
              formatado = "(" + digitos;
            }
            campoTelefone.value = formatado;
          });
        })();
      </script>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="small">Sou médico(a) ou secretário(a) &rarr; <strong>Entrar com e-mail e senha</strong></a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
