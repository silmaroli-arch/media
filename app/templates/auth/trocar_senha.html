{% extends "base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<h3 class="mb-3">Trocar senha</h3>
<div class="card p-4" style="max-width: 480px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Senha atual</label>
      <input type="password" name="senha_atual" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Nova senha</label>
      <input type="password" name="senha_nova" class="form-control" required minlength="6">
      <div class="form-text">Mínimo de 6 caracteres.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirmar nova senha</label>
      <input type="password" name="senha_confirmacao" class="form-control" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary">Salvar nova senha</button>
    <a href="{{ url_for('index') }}" class="btn btn-link">Cancelar</a>
  </form>
</div>
{% endblock %}
