{% extends "base.html" %}
{% block titulo %}Escolha a clínica{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-5">
      <div class="text-center mb-3"><img src="{{ url_for('static', filename='img/logo-horizontal.svg') }}" alt="MedIA" style="height: 52px;"></div>
      <p class="text-muted small text-center">
        Encontramos seu cadastro em mais de uma clínica com esse telefone e data de nascimento.
        Escolha qual você quer acessar agora.
      </p>
      <form method="post">
        <div class="list-group mb-3">
          {% for c in candidatos %}
          <label class="list-group-item d-flex align-items-center gap-2">
            <input class="form-check-input mt-0" type="radio" name="usuario_id_escolhido" value="{{ c.id }}" {% if loop.first %}checked{% endif %} required>
            <span>{{ c.paciente.clinica.nome }}</span>
          </label>
          {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
      <a href="{{ url_for('auth.login_paciente') }}" class="small text-center mt-3">&larr; Voltar</a>
    </div>
  </div>
</div>
{% endblock %}
