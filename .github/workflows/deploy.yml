name: Deploy no Elastic Beanstalk

on:
  push:
    branches: [dev, qualidade, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 (em vez do padrão 1) para o passo seguinte
          # conseguir comparar este commit com o anterior e listar os
          # arquivos alterados (usado no histórico de versões da tela de
          # login) - o auto_commit_push.bat sempre grava a mesma mensagem
          # genérica de commit ("Auto-commit: sincronizacao automatica"),
          # então a mensagem do commit em si não serve pra dizer o que
          # mudou.
          fetch-depth: 2

      - name: Definir qual ambiente da AWS corresponde a este branch
        id: ambiente
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment_name=media-prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "qualidade" ]; then
            echo "environment_name=media-qa" >> "$GITHUB_OUTPUT"
          else
            echo "environment_name=media-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar informações de versão/deploy
        run: |
          python3 -c "
          import json, subprocess

          def arquivos_alterados():
              # Lista os arquivos alterados neste commit - o
              # auto_commit_push.bat sempre usa a mesma mensagem genérica de
              # commit, então isso é mais útil pra dizer *o que* foi
              # publicado do que o assunto do commit em si.
              resultado = subprocess.run(
                  ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD'],
                  capture_output=True, text=True,
              )
              if resultado.returncode != 0:
                  return None
              return [l for l in resultado.stdout.strip().splitlines() if l]

          assunto = subprocess.run(
              ['git', 'log', '-1', '--pretty=%s'], capture_output=True, text=True
          ).stdout.strip()

          arquivos = arquivos_alterados()
          MENSAGEM_GENERICA = 'Auto-commit: sincronizacao automatica'
          if arquivos and (not assunto or assunto == MENSAGEM_GENERICA):
              LIMITE = 6
              listados = ', '.join(arquivos[:LIMITE])
              if len(arquivos) > LIMITE:
                  listados += f' e mais {len(arquivos) - LIMITE} arquivo(s)'
              mensagem = listados
          else:
              mensagem = assunto

          json.dump({
              'commit': '${{ github.sha }}',
              'commit_curto': '${{ github.sha }}'[:7],
              'branch': '${{ github.ref_name }}',
              'mensagem': mensagem,
              'deploy_em': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
          }, open('deploy_info.json', 'w'), ensure_ascii=False)
          "

      - name: Garantir que os hooks de deploy do Elastic Beanstalk sejam executáveis
        # O checkout costuma vir de uma máquina Windows, onde o bit de
        # execução do Unix não é preservado pelo Git - sem isso o Elastic
        # Beanstalk simplesmente ignora o hook silenciosamente (não dá erro,
        # só não roda).
        run: chmod +x .platform/hooks/*/*.sh || true

      - name: Compactar o projeto para o deploy
        run: zip -r deploy.zip . -x '.git/*' '.github/*'

      - name: Deploy no Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: media
          environment_name: ${{ steps.ambiente.outputs.environment_name }}
          region: sa-east-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
          use_existing_version_if_available: true          
